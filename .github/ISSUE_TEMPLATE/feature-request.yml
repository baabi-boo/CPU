name: Framework feature proposal (NOVA-M1)
description: Propose a bounded framework change supporting NOVA-M1.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Propose NOVA-M1 work in this repository; use the NOVA engineering proposal form for detailed architectural changes.
        Upstream escalation requires an isolated reproducer or clearly isolated framework requirement and maintainer review.
        Do not attach secrets, full environment dumps, private workloads, or restricted third-party IP.
  - type: checkboxes
    id: background
    attributes:
      label: Background Work
      description: Yes, I searched the following areas for a prior feature/solution to this problem.
      options:
        - label: I searched [NOVA-M1 issues](https://github.com/baabi-boo/CPU/issues) for related proposals.
          required: true
        - label: I checked the [NOVA roadmap](https://github.com/baabi-boo/CPU/blob/main/docs/nova/ROADMAP.md) and relevant framework documentation.
          required: true

  - type: textarea
    id: feature
    attributes:
      label: Feature Description
      description: Desired change, affected files/interfaces, alternatives, scope exclusions, and relevant requirement or gate IDs. A proposal is not an implemented capability.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Motivating example and acceptance criteria
      description: A public example, measurable objective, positive/negative tests, expected evidence, and bounded resource needs. Any new paid service or hardware access needs maintainer authorization.
    validations:
      required: true
