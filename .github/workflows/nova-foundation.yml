name: NOVA foundation checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nova-foundation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Repository governance and tooling (not RTL)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Record lightweight tool versions
        run: |
          git --version
          python3 --version
          make --version

      - name: Validate repository foundation
        run: make -f nova.mk check
